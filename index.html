<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTIERS — Рейтинг игроков</title>
    <!-- Подключаем официальный Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
        h1 { text-align: center; color: #39FF14; }
        .container { max-width: 800px; margin: 0 auto; }
        .tier-block { background: #1e1e1e; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #333; }
        .tier-title { color: #39FF14; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .player { display: flex; align-items: center; margin: 8px 0; background: #2a2a2a; padding: 8px 12px; border-radius: 6px; }
        .player img { border-radius: 50%; margin-right: 12px; width: 36px; height: 36px; }
        .empty { color: #888; font-style: italic; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📊 Рейтинг игроков VTIERS</h1>
        <div id="tiers-container">⏳ Загрузка тиров из базы...</div>
    </div>

    <script>
        // Вставьте ваши данные из панели Supabase (Project Settings -> API)
        const SUPABASE_URL = 'sb_secret_OTObpgxJPmnPPuZknyOtJw_JQudioul';
        const SUPABASE_ANON_KEY = 'sb_publishable_SIuXXbkNXgy1R2pMid9JSQ_6pkZZN9H';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadTiers() {
            const container = document.getElementById('tiers-container');

            // Запрашиваем всех игроков из таблицы player_tiers
            const { data: players, error } = await _supabase
                .from('player_tiers')
                .select('*');

            if (error) {
                container.innerHTML = `<p class="empty">Ошибка загрузки данных: ${error.message}</p>`;
                return;
            }

            if (!players || players.length === 0) {
                container.innerHTML = '<p class="empty">База данных тиров пока пуста. Дождитесь синхронизации от бота.</p>';
                return;
            }

            // Группируем игроков по тирам
            const groupedTiers = {};
            players.forEach(p => {
                if (!groupedTiers[p.tier]) groupedTiers[p.tier] = [];
                groupedTiers[p.tier].push(p);
            });

            container.innerHTML = '';

            // Выводим блоки по тирам
            for (const [tierName, tierPlayers] of Object.entries(groupedTiers)) {
                let html = `<div class="tier-block"><h2 class="tier-title">🏆 ${tierName}</h2>`;
                
                tierPlayers.forEach(player => {
                    html += `
                        <div class="player">
                            <img src="${player.avatar_url}" alt="Avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                            <span><strong>${player.display_name || player.username}</strong> (@${player.username})</span>
                        </div>
                    `;
                });

                html += `</div>`;
                container.innerHTML += html;
            }
        }

        loadTiers();
    </script>
</body>
</html>
