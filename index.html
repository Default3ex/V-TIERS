<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTIERS — Рейтинг игроков</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; padding: 20px; }
        h1 { text-align: center; color: #39FF14; margin-bottom: 10px; }
        
        /* Панель управления и кнопка */
        .controls { text-align: center; margin-bottom: 25px; }
        .btn-refresh {
            background: #39FF14; color: #000; border: none; padding: 10px 20px;
            font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .btn-refresh:hover { background: #2ecc71; transform: scale(1.05); }
        .btn-refresh:active { transform: scale(0.98); }

        .tier-block { background: #1e1e1e; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #333; }
        .tier-title { color: #39FF14; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 8px; }
        
        /* Интерактивные карточки игроков */
        .player { 
            display: flex; align-items: center; margin: 8px 0; background: #2a2a2a; 
            padding: 8px 12px; border-radius: 6px; text-decoration: none; color: white;
            cursor: pointer; transition: background 0.2s, transform 0.1s;
        }
        .player:hover { background: #3a3a3a; transform: translateX(5px); }
        .player img { border-radius: 50%; margin-right: 12px; width: 36px; height: 36px; }
        
        .empty { color: #888; font-style: italic; }
        #error-log { color: #ff5555; background: #2b0000; padding: 10px; border-radius: 6px; display: none; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>📊 Рейтинг игроков VTIERS</h1>
    
    <div class="controls">
        <button class="btn-refresh" onclick="loadTiers()">🔄 Обновить тиры</button>
    </div>

    <div id="error-log"></div>
    <div id="tiers-container">⏳ Загрузка данных с сервера...</div>

    <script>
        const TARGET_URL = 'http://167.235.13.16:25337/api/tiers';
        const API_URL = `https://api.allorigins.win/raw?url=${encodeURIComponent(TARGET_URL)}`;

        async function loadTiers() {
            const container = document.getElementById('tiers-container');
            const errorLog = document.getElementById('error-log');
            
            errorLog.style.display = 'none';
            container.style.opacity = '0.5';

            try {
                // Добавляем timestamp, чтобы обходить кэширование при частых кликах
                const response = await fetch(`${API_URL}&t=${Date.now()}`);
                if (!response.ok) throw new Error(`Ошибка сети: ${response.status}`);
                
                const data = await response.json();
                container.innerHTML = '';

                if (Object.keys(data).length === 0) {
                    container.innerHTML = '<p class="empty">Данные о тирах пока пусты.</p>';
                    return;
                }

                for (const [tierName, players] of Object.entries(data)) {
                    let html = `<div class="tier-block"><h2 class="tier-title">🏆 ${tierName}</h2>`;

                    if (!players || players.length === 0) {
                        html += `<p class="empty">В этом тире нет игроков.</p>`;
                    } else {
                        players.forEach(player => {
                            html += `
                                <a class="player" href="${player.avatar}" target="_blank" title="Нажмите, чтобы открыть аватар">
                                    <img src="${player.avatar}" alt="Avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                                    <span><strong>${player.displayName}</strong> (@${player.username})</span>
                                </a>
                            `;
                        });
                    }
                    
                    html += `</div>`;
                    container.innerHTML += html;
                }
            } catch (error) {
                console.error('Ошибка API:', error);
                errorLog.style.display = 'block';
                errorLog.innerText = `❌ Не удалось загрузить данные: ${error.message}`;
                container.innerHTML = '<p class="empty">Ошибка загрузки. Проверьте консоль браузера.</p>';
            } finally {
                container.style.opacity = '1';
            }
        }

        loadTiers();
    </script>

</body>
</html>
